name: DevFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend Automated Checks & Pytest Suite
  # ---------------------------------------------------------------------------
  backend-checks:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend pytest suite (isolated SQLite test DB)
        env:
          DEVFLOW_TEST_DATABASE_URL: sqlite:///./test_devflow.db
        run: |
          cd backend
          python -m pytest tests -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2: Frontend Typecheck & Production Build
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type-check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # Job 3: Docker & Container Configuration Validation
  # ---------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose specification
        run: |
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-run backend container build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: false

      - name: Dry-run frontend container build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: false
