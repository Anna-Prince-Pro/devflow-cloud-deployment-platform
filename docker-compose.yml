version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: devflow-postgres
    environment:
      POSTGRES_DB: devflow_db
      POSTGRES_USER: devflow_user
      POSTGRES_PASSWORD: devflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow_user -d devflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
